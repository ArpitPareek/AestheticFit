<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AestheticFit" />
<title>AestheticFit — Two-Profile Gym & Diet Helper</title>
<link rel="manifest" id="manifest-link" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { display: ['"Bebas Neue"', 'sans-serif'], sans: ['Sora','system-ui','sans-serif'] },
      colors: {
        ink: { 950:'#08090b',900:'#0e1014',800:'#15181d',700:'#1e2229',600:'#2a2f38',500:'#3a4049',400:'#5a6271',300:'#8a93a3',200:'#c3c9d4',100:'#e8ebf0' },
        emerald:{DEFAULT:'#10b981',soft:'#34d39922'},
        amber:{DEFAULT:'#f59e0b',soft:'#f59e0b22'},
        rose:{DEFAULT:'#f43f5e',soft:'#f43f5e22'},
        crimson:'#ef4444',
      },
    }},
  };
</script>
<style>
  html,body{background:#08090b;color:#e8ebf0;font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .font-display{font-family:'Bebas Neue',sans-serif;letter-spacing:.02em;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:3px 3px;opacity:.6;}
  .ring-soft{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:3px;}
  .view{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .ring-track{stroke:#1e2229;}
  .card{transition:border-color .2s ease,transform .2s ease;}
  .card:hover{border-color:#2a2f38;}
  .nav-btn[data-active="true"]{color:#10b981;}
  .nav-btn[data-active="true"] .nav-icon-wrap{background:#10b98115;}
  .anim-path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 2s ease-in-out infinite alternate;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .pulse-soft{animation:pulseSoft 2.4s ease-in-out infinite;}
  @keyframes pulseSoft{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
  details summary::-webkit-details-marker{display:none;}
  details[open] .chev{transform:rotate(180deg);}
  .chev{transition:transform .2s ease;}
  .chk{appearance:none;width:18px;height:18px;border:1.5px solid #3a4049;border-radius:5px;background:#0e1014;cursor:pointer;position:relative;flex-shrink:0;}
  .chk:checked{background:#10b981;border-color:#10b981;}
  .chk:checked::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #0a0a0a;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .safe-top{padding-top:env(safe-area-inset-top);}
  .today-dot::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;background:#10b981;border-radius:999px;box-shadow:0 0 0 2px #08090b;}
  .prof-btn{transition:all .2s ease;}
  .prof-btn[data-active="true"][data-color="emerald"]{background:#10b981;color:#08090b;}
  .prof-btn[data-active="true"][data-color="rose"]{background:#f43f5e;color:#08090b;}
</style>
</head>
<body class="min-h-screen relative">

<!-- HEADER -->
<header class="safe-top sticky top-0 z-30 backdrop-blur-xl bg-ink-950/70 border-b border-ink-800">
  <div class="max-w-3xl mx-auto px-4 py-3 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald/15 grid place-items-center ring-soft">
          <i data-lucide="flame" class="w-4 h-4 text-emerald"></i>
        </div>
        <div>
          <div class="font-display text-xl leading-none">AestheticFit</div>
          <div class="text-[10px] text-ink-300 -mt-0.5 tracking-wide uppercase" id="todayStr"></div>
        </div>
      </div>
      <button id="resetBtn" class="text-ink-300 hover:text-crimson p-2 rounded-lg" title="Reset day">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
    <!-- Profile switcher -->
    <div class="grid grid-cols-2 gap-2 bg-ink-900 rounded-xl p-1 ring-soft">
      <button class="prof-btn py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 text-ink-300" data-profile="arpit" data-color="emerald">
        <i data-lucide="user" class="w-4 h-4"></i><span>Arpit</span>
      </button>
      <button class="prof-btn py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 text-ink-300" data-profile="harshita" data-color="rose">
        <i data-lucide="user" class="w-4 h-4"></i><span>Harshita</span>
      </button>
    </div>
  </div>
</header>

<main class="relative z-10 max-w-3xl mx-auto px-4 pb-32 pt-4">

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view space-y-5">
    <!-- Profile summary card -->
    <div id="profileCard" class="bg-ink-900 ring-soft rounded-2xl p-5"></div>

    <!-- Day indicator -->
    <div class="bg-ink-900 ring-soft rounded-2xl p-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <i data-lucide="calendar-days" class="w-4 h-4 text-emerald"></i>
        <div>
          <div class="text-[10px] uppercase tracking-widest text-ink-300">Showing</div>
          <div class="font-display text-xl leading-none" id="dashDayLabel">Monday</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-[10px] uppercase tracking-widest text-ink-300">Plan</div>
        <div class="text-sm font-medium" id="dashWorkoutLabel">Push A</div>
      </div>
    </div>

    <!-- Hero rings -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-ink-900 ring-soft rounded-2xl p-4 flex flex-col items-center gap-2">
        <svg width="64" height="64" viewBox="0 0 64 64" class="-rotate-90">
          <circle cx="32" cy="32" r="26" stroke-width="6" fill="none" class="ring-track"/>
          <circle id="ringSteps" cx="32" cy="32" r="26" stroke-width="6" fill="none" stroke="#10b981" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <div class="text-center">
          <div class="font-display text-xl leading-none" id="stepsVal">0</div>
          <div class="text-[10px] text-ink-300 uppercase tracking-wider">/ 10,000 steps</div>
        </div>
      </div>
      <div class="bg-ink-900 ring-soft rounded-2xl p-4 flex flex-col items-center gap-2">
        <svg width="64" height="64" viewBox="0 0 64 64" class="-rotate-90">
          <circle cx="32" cy="32" r="26" stroke-width="6" fill="none" class="ring-track"/>
          <circle id="ringCal" cx="32" cy="32" r="26" stroke-width="6" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <div class="text-center">
          <div class="font-display text-xl leading-none"><span id="calVal">0</span></div>
          <div class="text-[10px] text-ink-300 uppercase tracking-wider">/ <span id="calTarget">2400</span> kcal</div>
        </div>
      </div>
      <div class="bg-ink-900 ring-soft rounded-2xl p-4 flex flex-col items-center gap-2">
        <svg width="64" height="64" viewBox="0 0 64 64" class="-rotate-90">
          <circle cx="32" cy="32" r="26" stroke-width="6" fill="none" class="ring-track"/>
          <circle id="ringWater" cx="32" cy="32" r="26" stroke-width="6" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <div class="text-center">
          <div class="font-display text-xl leading-none"><span id="waterVal">0</span></div>
          <div class="text-[10px] text-ink-300 uppercase tracking-wider">/ 8 glasses</div>
        </div>
      </div>
    </div>

    <!-- Quick add -->
    <div class="grid grid-cols-2 gap-3">
      <button class="quick-add bg-ink-900 ring-soft rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-ink-800" data-action="addSteps" data-amount="1000">
        <i data-lucide="footprints" class="w-4 h-4 text-emerald"></i><span class="text-sm">+1,000 steps</span>
      </button>
      <button class="quick-add bg-ink-900 ring-soft rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-ink-800" data-action="addWater" data-amount="1">
        <i data-lucide="droplet" class="w-4 h-4 text-sky-400"></i><span class="text-sm">+1 glass water</span>
      </button>
    </div>

    <!-- Calorie balance -->
    <div class="bg-gradient-to-br from-ink-900 to-ink-800 ring-soft rounded-2xl p-5">
      <div class="flex items-baseline justify-between mb-3">
        <h3 class="font-display text-2xl">Daily Energy</h3>
        <span class="text-[11px] text-ink-300 uppercase tracking-wider">In · Out · Net</span>
      </div>
      <div class="grid grid-cols-3 gap-3 text-center">
        <div><div class="text-2xl font-display text-emerald" id="inVal">0</div><div class="text-[10px] text-ink-300 uppercase tracking-wider">Eaten</div></div>
        <div><div class="text-2xl font-display text-amber" id="outVal">0</div><div class="text-[10px] text-ink-300 uppercase tracking-wider">Burned (workout)</div></div>
        <div><div class="text-2xl font-display" id="netVal">0</div><div class="text-[10px] text-ink-300 uppercase tracking-wider">Net intake</div></div>
      </div>
      <div id="dashTip" class="mt-3 text-[11px] text-ink-300 leading-relaxed"></div>
    </div>

    <!-- Health checklist -->
    <div class="bg-ink-900 ring-soft rounded-2xl p-5">
      <h3 class="font-display text-2xl mb-3 flex items-center gap-2">
        <i data-lucide="heart-pulse" class="w-5 h-5 text-emerald"></i>Daily Health Checklist
      </h3>
      <div id="checklistBox" class="space-y-2"></div>
    </div>

    <!-- Recomp / fatloss math -->
    <div id="mathCard" class="bg-ink-900 ring-soft rounded-2xl p-5"></div>
  </section>

  <!-- WORKOUT -->
  <section id="view-workout" class="view space-y-4 hidden">
    <div id="workoutHero" class="bg-gradient-to-br from-emerald/10 to-transparent ring-soft rounded-2xl p-5"></div>
    <div id="workoutDayPicker" class="grid grid-cols-7 gap-1.5"></div>
    <div id="workoutBody" class="space-y-3"></div>
    <div id="workoutSafety" class="bg-amber/10 ring-soft rounded-2xl p-4 flex gap-3 items-start"></div>
  </section>

  <!-- DIET -->
  <section id="view-diet" class="view space-y-4 hidden">
    <div id="dietHero" class="bg-gradient-to-br from-amber/10 to-transparent ring-soft rounded-2xl p-5"></div>
    <div id="dietDayPicker" class="grid grid-cols-7 gap-1.5"></div>
    <div class="bg-ink-900 ring-soft rounded-2xl p-4">
      <div class="flex items-baseline justify-between mb-2">
        <div class="text-[10px] uppercase tracking-widest text-ink-300">Day Total · <span id="dietDayLabel">Monday</span></div>
        <div class="text-[10px] uppercase tracking-widest text-ink-300">Plan · <span id="dietPlanTotal">2400 kcal</span></div>
      </div>
      <div class="grid grid-cols-5 gap-2 text-center">
        <div class="bg-ink-800/60 rounded-lg py-2"><div class="text-[10px] uppercase text-ink-300">kcal</div><div class="font-display text-lg text-amber"><span id="dCal">0</span>/<span id="dCalMax">2400</span></div></div>
        <div class="bg-ink-800/60 rounded-lg py-2"><div class="text-[10px] uppercase text-ink-300">Pro</div><div class="font-display text-lg text-emerald" id="dPro">0g</div></div>
        <div class="bg-ink-800/60 rounded-lg py-2"><div class="text-[10px] uppercase text-ink-300">Carb</div><div class="font-display text-lg text-amber" id="dCarb">0g</div></div>
        <div class="bg-ink-800/60 rounded-lg py-2"><div class="text-[10px] uppercase text-ink-300">Fat</div><div class="font-display text-lg text-sky-400" id="dFat">0g</div></div>
        <div class="bg-ink-800/60 rounded-lg py-2"><div class="text-[10px] uppercase text-ink-300">Fib</div><div class="font-display text-lg text-emerald" id="dFib">0g</div></div>
      </div>
    </div>
    <div id="dietBody" class="space-y-3"></div>
    <div id="pantryCard" class="bg-ink-900 ring-soft rounded-2xl p-5"></div>
  </section>

  <!-- PHYSIO -->
  <section id="view-physio" class="view space-y-4 hidden">
    <div id="physioHero" class="bg-gradient-to-br from-sky-500/10 to-transparent ring-soft rounded-2xl p-5"></div>
    <div id="physioBody" class="space-y-3"></div>
    <div id="physioSafety" class="bg-crimson/10 ring-soft rounded-2xl p-4 flex gap-3 items-start"></div>
  </section>
</main>

<nav class="fixed bottom-0 left-0 right-0 z-30 bg-ink-950/85 backdrop-blur-xl border-t border-ink-800">
  <div class="max-w-3xl mx-auto grid grid-cols-4 px-2 py-2" style="padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));">
    <button class="nav-btn flex flex-col items-center gap-1 py-1.5 text-ink-300" data-view="dashboard" data-active="true">
      <div class="nav-icon-wrap w-9 h-9 grid place-items-center rounded-xl"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></div>
      <span class="text-[10px] uppercase tracking-wider">Home</span>
    </button>
    <button class="nav-btn flex flex-col items-center gap-1 py-1.5 text-ink-300" data-view="workout">
      <div class="nav-icon-wrap w-9 h-9 grid place-items-center rounded-xl"><i data-lucide="dumbbell" class="w-5 h-5"></i></div>
      <span class="text-[10px] uppercase tracking-wider">Workout</span>
    </button>
    <button class="nav-btn flex flex-col items-center gap-1 py-1.5 text-ink-300" data-view="diet">
      <div class="nav-icon-wrap w-9 h-9 grid place-items-center rounded-xl"><i data-lucide="utensils" class="w-5 h-5"></i></div>
      <span class="text-[10px] uppercase tracking-wider">Diet</span>
    </button>
    <button class="nav-btn flex flex-col items-center gap-1 py-1.5 text-ink-300" data-view="physio">
      <div class="nav-icon-wrap w-9 h-9 grid place-items-center rounded-xl"><i data-lucide="activity" class="w-5 h-5"></i></div>
      <span class="text-[10px] uppercase tracking-wider">Physio</span>
    </button>
  </div>
</nav>

<script>
/* ================================================================
   AESTHETICFIT v3 — Two-Profile PWA (Arpit + Harshita)
   ================================================================ */

/* ---------- 0. SAFE ICON HELPER ---------- */
function safeIcons(){
  if(typeof lucide!=='undefined'&&lucide.createIcons){ try{lucide.createIcons();}catch(e){} }
  else{ setTimeout(()=>{ if(typeof lucide!=='undefined'&&lucide.createIcons){ try{lucide.createIcons();}catch(e){} } },200); }
}

/* ---------- 1. DAY HELPERS ---------- */
// 1=Mon ... 7=Sun
const DAY_LABELS = {1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday',7:'Sunday'};
const DAY_SHORT  = {1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',7:'Sun'};
function todayDow(){ const d=new Date().getDay(); return d===0?7:d; }
function getWeekStart(){
  const d=new Date(); const dow=d.getDay(); const diff=dow===0?-6:1-dow;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

/* ---------- 2. SVG POSE LIBRARY (shared) ---------- */
function svgPose(type){
  const base=(inner)=>`<svg viewBox="0 0 200 120" class="w-full h-full">${inner}</svg>`;
  const STROKE=`stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const BAR=`stroke="#f59e0b" stroke-width="3" stroke-linecap="round"`;
  const BENCH=`stroke="#5a6271" stroke-width="2" fill="#15181d"`;
  const HEAD=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="7" ${STROKE}/>`;
  switch(type){
    case 'machineChestPress': return base(`<rect x="20" y="80" width="60" height="6" ${BENCH}/><rect x="20" y="40" width="6" height="42" ${BENCH}/>${HEAD(50,46)}<path d="M50 53 L50 80 M50 60 L78 55 M50 60 L78 75" ${STROKE}/><line x1="78" y1="55" x2="120" y2="50" ${BAR}/><line x1="78" y1="75" x2="120" y2="80" ${BAR}/><circle cx="125" cy="50" r="6" fill="#f59e0b"/><circle cx="125" cy="80" r="6" fill="#f59e0b"/>`);
    case 'inclineDB': return base(`<path d="M30 95 L160 60" ${BENCH}/>${HEAD(80,65)}<path d="M85 70 L120 78 M85 70 L120 50" ${STROKE}/><circle cx="125" cy="48" r="5" fill="#f59e0b"/><circle cx="125" cy="80" r="5" fill="#f59e0b"/>`);
    case 'cableFly': return base(`${HEAD(100,40)}<path d="M100 47 L100 85" ${STROKE}/><path d="M100 55 L60 45 M100 55 L140 45" ${STROKE}/><rect x="20" y="20" width="14" height="80" fill="#15181d" stroke="#5a6271"/><rect x="166" y="20" width="14" height="80" fill="#15181d" stroke="#5a6271"/>`);
    case 'tricepPush': return base(`${HEAD(100,40)}<path d="M100 47 L100 95" ${STROKE}/><path d="M100 55 L120 70 L130 90 M100 55 L80 70 L70 90" ${STROKE}/><line x1="60" y1="92" x2="140" y2="92" ${BAR}/>`);
    case 'lateralRaise': return base(`${HEAD(100,40)}<path d="M100 47 L100 95" ${STROKE}/><path d="M100 55 L60 50 M100 55 L140 50" ${STROKE}/><circle cx="55" cy="50" r="6" fill="#f59e0b"/><circle cx="145" cy="50" r="6" fill="#f59e0b"/>`);
    case 'latPulldown': return base(`<line x1="40" y1="20" x2="160" y2="20" ${BAR}/><path d="M70 20 L70 55 M130 20 L130 55" ${STROKE}/>${HEAD(100,60)}<path d="M100 67 L100 100" ${STROKE}/><path d="M100 70 L70 55 M100 70 L130 55" ${STROKE}/><rect x="85" y="100" width="30" height="6" fill="#5a6271"/>`);
    case 'chestSupportedRow': return base(`<path d="M30 80 L100 50 L100 30" ${BENCH}/>${HEAD(100,38)}<path d="M100 45 L100 70" ${STROKE}/><path d="M100 55 L130 65 M100 55 L70 65" ${STROKE}/><circle cx="135" cy="68" r="6" fill="#f59e0b"/><circle cx="65" cy="68" r="6" fill="#f59e0b"/>`);
    case 'facePull': return base(`${HEAD(100,45)}<path d="M100 52 L100 95" ${STROKE}/><path d="M100 58 L70 48 M100 58 L130 48" ${STROKE}/><line x1="20" y1="35" x2="70" y2="48" stroke="#5a6271" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="180" y1="35" x2="130" y2="48" stroke="#5a6271" stroke-width="1.5" stroke-dasharray="3 3"/>`);
    case 'bicepCurl': return base(`${HEAD(100,40)}<path d="M100 47 L100 100" ${STROKE}/><path d="M100 55 L75 65 L75 80 M100 55 L125 65 L125 80" ${STROKE}/><circle cx="75" cy="85" r="6" fill="#f59e0b"/><circle cx="125" cy="85" r="6" fill="#f59e0b"/>`);
    case 'hammerCurl': return base(`${HEAD(100,40)}<path d="M100 47 L100 100" ${STROKE}/><path d="M100 55 L80 70 L82 88 M100 55 L120 70 L118 88" ${STROKE}/><rect x="76" y="86" width="12" height="6" fill="#f59e0b"/><rect x="112" y="86" width="12" height="6" fill="#f59e0b"/>`);
    case 'legPress': return base(`<path d="M30 95 L150 60 L150 30" ${BENCH}/>${HEAD(60,80)}<path d="M65 85 L100 75" ${STROKE}/><path d="M100 75 L120 55 L140 50" ${STROKE}/><rect x="135" y="35" width="40" height="35" fill="#15181d" stroke="#f59e0b" stroke-width="2"/>`);
    case 'legExt': return base(`<rect x="60" y="60" width="70" height="20" ${BENCH}/>${HEAD(70,55)}<path d="M70 62 L120 70 L155 90" ${STROKE}/><circle cx="155" cy="90" r="6" fill="#f59e0b"/>`);
    case 'lunges': return base(`${HEAD(80,30)}<path d="M80 37 L80 70" ${STROKE}/><path d="M80 70 L50 100 M80 70 L120 90 L130 100" ${STROKE}/><path d="M80 50 L65 65 M80 50 L95 65" ${STROKE}/><circle cx="60" cy="68" r="5" fill="#f59e0b"/><circle cx="100" cy="68" r="5" fill="#f59e0b"/>`);
    case 'calf': return base(`<rect x="60" y="60" width="80" height="15" ${BENCH}/>${HEAD(100,30)}<path d="M100 37 L100 60" ${STROKE}/><path d="M100 60 L85 95 M100 60 L115 95" ${STROKE}/><path d="M80 95 L140 95 L140 90 L80 90 Z" fill="#f59e0b"/>`);
    case 'plank': return base(`${HEAD(40,55)}<path d="M45 60 L150 60" ${STROKE}/><path d="M50 62 L55 90 M145 62 L150 90" ${STROKE}/><path d="M40 100 L170 100" stroke="#5a6271" stroke-width="2"/>`);

/* ---------- 4. STATE ---------- */
const STORAGE_KEY = 'aestheticfit-v3';

function freshDay(profileKey) {
  const p = PROFILES[profileKey];
  return {
    steps: 0,
    water: 0,
    mealsDone: {},
    workoutDone: {},
    checklist: Object.fromEntries(p.checklist.map(c => [c.id, false])),
  };
}
function freshProfileState(profileKey) {
  const td = todayDow();
  const days = {};
  for (let i = 1; i <= 7; i++) days[i] = freshDay(profileKey);
  return { days, selectedDietDay: td, selectedWorkoutDay: td, physioDone: {} };
}
function freshState() {
  return {
    weekStart: getWeekStart(),
    activeProfile: 'arpit',
    profiles: {
      arpit: freshProfileState('arpit'),
      harshita: freshProfileState('harshita'),
    },
  };
}
function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s.weekStart !== getWeekStart()) return freshState();
      // Defensive: ensure both profiles + all day slots exist
      if (!s.activeProfile) s.activeProfile = 'arpit';
      if (!s.profiles) s.profiles = {};
      ['arpit','harshita'].forEach(pk => {
        if (!s.profiles[pk]) s.profiles[pk] = freshProfileState(pk);
        for (let i = 1; i <= 7; i++) {
          if (!s.profiles[pk].days[i]) s.profiles[pk].days[i] = freshDay(pk);
          // Ensure checklist keys match current profile definition
          const cl = s.profiles[pk].days[i].checklist || {};
          PROFILES[pk].checklist.forEach(c => { if (!(c.id in cl)) cl[c.id] = false; });
          s.profiles[pk].days[i].checklist = cl;
        }
        if (!s.profiles[pk].physioDone) s.profiles[pk].physioDone = {};
      });
      return s;
    } catch { return freshState(); }
  }
  return freshState();
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();

/* ---------- 5. ACTIVE-PROFILE HELPERS ---------- */
function P()  { return PROFILES[state.activeProfile]; }         // active profile definition
function PS() { return state.profiles[state.activeProfile]; }   // active profile state
function curDay(dn) { return PS().days[dn]; }

function dayTotals(dn) {
  const d = curDay(dn);
  const meals = P().diet[dn].meals;
  let cal=0, p=0, c=0, f=0, fb=0;
  meals.forEach((m, i) => {
    if (d.mealsDone[i]) { cal+=m.cal; p+=m.protein; c+=m.carbs; f+=m.fat; fb+=m.fiber; }
  });
  return { cal, protein:p, carbs:c, fat:f, fiber:fb };
}
function workoutBurned(dn) {
  const w = P().workouts[dn];
  const d = curDay(dn);
  return w.exercises.reduce((sum, ex, i) => sum + (d.workoutDone[i] ? ex.cal : 0), 0);
}

/* ---------- 8. RENDER: DASHBOARD ---------- */
function updateRings() {
  const dn = PS().selectedDietDay;
  const p = P();
  const w = p.diet[dn];
  const dayState = curDay(dn);
  const totals = dayTotals(dn);
  const burned = workoutBurned(dn);

  $('#dashDayLabel').textContent = w.label + (dn === todayDow() ? ' · Today' : '');
  $('#dashWorkoutLabel').textContent = p.workouts[dn].name.split(' · ')[0];
  $('#calTarget').textContent = w.targetCal.toLocaleString();

  const setRing = (id, val, max, color) => {
    const c = $('#'+id); if (!c) return;
    const circ = 2 * Math.PI * 26;
    const pct = Math.min(1, val/max);
    c.setAttribute('stroke-dasharray', circ);
    c.setAttribute('stroke-dashoffset', circ * (1 - pct));
    if (color) c.setAttribute('stroke', color);
  };
  setRing('ringSteps', dayState.steps, p.targets.steps, p.accent);
  setRing('ringCal',   totals.cal,     w.targetCal);
  setRing('ringWater', dayState.water, p.targets.water);

  $('#stepsVal').textContent = dayState.steps.toLocaleString();
  $('#calVal').textContent = totals.cal.toLocaleString();
  $('#waterVal').textContent = dayState.water;
  $('#inVal').textContent  = totals.cal.toLocaleString();
  $('#outVal').textContent = burned.toLocaleString();
  $('#netVal').textContent = (totals.cal - burned).toLocaleString();

  const tip = $('#dashTip');
  if (w.isCheatDay) {
    tip.innerHTML = `<strong class="text-amber">Sunday rules:</strong> Cheat meal is intentional, not failure. The dinner protein baseline is non-negotiable so you don't lose muscle. Sleep is the real recovery today.`;
  } else if (p.workouts[dn].isRest) {
    tip.textContent = 'Recovery day — light movement + hit your protein floor.';
  } else if (state.activeProfile === 'harshita') {
    tip.textContent = 'Fat-loss target: 400–600 kcal deficit today. Protein first, calories second, walk third.';
  } else {
    tip.textContent = 'Training day target: slight surplus (~+150 kcal). Protein first, calories second.';
  }
}

/* ---------- 13. NAV + PROFILE SWITCHING ---------- */
function showView(v) {
  ['dashboard','workout','diet','physio'].forEach(name => {
    $('#view-'+name).classList.toggle('hidden', name !== v);
  });
  $$('.nav-btn').forEach(b => b.dataset.active = (b.dataset.view === v) ? 'true' : 'false');
  const el = $('#view-'+v); el.classList.remove('view'); void el.offsetWidth; el.classList.add('view');
}
function switchProfile(profileKey) {
  if (state.activeProfile === profileKey) return;
  state.activeProfile = profileKey;
  saveState();
  renderAll();
}
function attachGlobalHandlers() {
  $$('.nav-btn').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
  $$('.prof-btn').forEach(b => b.addEventListener('click', () => switchProfile(b.dataset.profile)));
  $$('.quick-add').forEach(b => b.addEventListener('click', () => {
    const action = b.dataset.action;
    const amt = +b.dataset.amount;
    const dn = PS().selectedDietDay;
    if (action === 'addSteps') curDay(dn).steps = Math.min(curDay(dn).steps + amt, 99999);
    if (action === 'addWater') curDay(dn).water = Math.min(curDay(dn).water + amt, 16);
    saveState();
    updateRings();
  }));
  $('#resetBtn').addEventListener('click', () => {
    const dn = PS().selectedDietDay;
    if (confirm(`Reset ${DAY_LABELS[dn]}'s progress for ${P().name}?`)) {
      PS().days[dn] = freshDay(state.activeProfile);
      saveState();
      renderAll();
    }
  });
}

/* ---------- 14. PWA MANIFEST + SW ---------- */
const MANIFEST = {
  name: 'AestheticFit — Two-Profile Gym & Diet',
  short_name: 'AestheticFit',
  description: 'Two-profile PWA: Arpit recomp + Harshita fat-loss, weekly diet + workout + physio.',
  start_url: '.', display: 'standalone',
  background_color: '#08090b', theme_color: '#08090b', orientation: 'portrait',
  icons: [
    { src: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#08090b"/><circle cx="96" cy="96" r="40" fill="none" stroke="#10b981" stroke-width="10"/><path d="M70 96 L88 110 L122 78" stroke="#10b981" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`), sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
    { src: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#08090b"/><circle cx="256" cy="256" r="110" fill="none" stroke="#10b981" stroke-width="28"/><path d="M186 256 L236 296 L326 206" stroke="#10b981" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`), sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
  ]
};
try {
  const manifestBlob = new Blob([JSON.stringify(MANIFEST)], { type: 'application/json' });
  const link = document.getElementById('manifest-link');
  if (link) link.href = URL.createObjectURL(manifestBlob);
} catch (e) {}
const SW_CODE = `
  const CACHE = 'aestheticfit-v3';
  self.addEventListener('install', e => { self.skipWaiting(); });
  self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
  self.addEventListener('fetch', e => {
    if (e.request.method !== 'GET') return;
    e.respondWith(caches.open(CACHE).then(cache =>
      cache.match(e.request).then(hit => hit || fetch(e.request).then(res => {
        if (res.ok) cache.put(e.request, res.clone());
        return res;
      }).catch(()=>hit))
    ));
  });
`;
if ('serviceWorker' in navigator) {
  try {
    const swBlob = new Blob([SW_CODE], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  } catch (e) {}
}

/* ---------- 15. BOOT ---------- */
function renderAll() {
  $('#todayStr').textContent = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  renderProfileSwitcher();
  renderProfileCard();
  renderMathCard();
  renderWorkoutHero();
  renderDietHero();
  renderPhysioHero();
  renderWorkoutDayPicker();
  renderDietDayPicker();
  updateRings();
  renderChecklist();
  renderWorkout();
  renderDiet();
  renderPhysio();
  safeIcons();
}
function boot() {
  attachGlobalHandlers();
  renderAll();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
